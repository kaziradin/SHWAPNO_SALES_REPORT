# nginx for the static dashboard (out/ from `next build`, with trailing slashes: each page is a folder with index.html)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # the hashed build files never change, so browsers may keep them
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # the pages are checked each time, so a new data update shows at once
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
